name: isim_sehir_hayvan
description: "İsim Şehir Hayvan - Çok Oyunculu Kelime Oyunu"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  device_info_plus: ^10.1.2 # Veya güncel sürümü
  # Google AdMob Reklam Paketi
  google_mobile_ads: ^9.0.0

  # Firebase Servisleri
  firebase_core: ^3.4.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.0

  # Yerel Veritabanı ve Önbellek
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Ağ / Senkronizasyon
  http: ^1.6.0

  # Paylaşım ve Derin Link (Deep Link) Paketleri
  share_plus: ^12.0.2
  app_links: ^7.2.1

  # UI İkon Paketleri (İsteğe bağlı, Material Icon'lar için varsayılan)
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # 🎯 Veritabanı ve Medya Dosyaları Tanımı
  assets:
    - assets/game_data.sql
    - assets/logo.png

# DİKKAT: Bu kısım içeride değil, tamamen en sola yaslı olmalı!
flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  android_12:
    image: assets/logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"