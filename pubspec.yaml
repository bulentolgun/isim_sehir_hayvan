name: isim_sehir_hayvan
description: "İsim Şehir Hayvan - Çok Oyunculu Kelime Oyunu"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  device_info_plus: ^10.1.2 # Veya güncel sürümü
  # Google AdMob Reklam Paketi
  google_mobile_ads: ^9.0.0

  # Firebase Servisleri
  firebase_core: ^3.4.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.0

  # Yerel Veritabanı ve Önbellek
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Ağ / Senkronizasyon
  http: ^1.6.0

  # Paylaşım ve Derin Link (Deep Link) Paketleri
  share_plus: ^12.0.2
  app_links: ^7.2.1

  # UI İkon Paketleri (İsteğe bağlı, Material Icon'lar için varsayılan)
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 🎯 Veritabanı ve Medya Dosyaları Tanımı
  assets:
    - assets/game_data.sql
